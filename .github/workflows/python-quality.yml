name: Python quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97b # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
      - name: Install locked development tools
        run: uv sync --locked --only-group quality
      - name: Read the previous baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          python scripts/ci/prepare_python_complexity_baseline.py "$RUNNER_TEMP/base-complexipy-snapshot.json"
      - name: Check Python cognitive complexity
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/base-complexipy-snapshot.json" ]]; then
            export WEB_DECISION_COMPLEXITY_BASELINE="$RUNNER_TEMP/base-complexipy-snapshot.json"
          fi
          uv run --locked --no-sync --only-group quality python scripts/ci/check_python_complexity.py
      - name: Read the previous Ruff snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          python scripts/ci/prepare_python_quality_baseline.py "$RUNNER_TEMP/base-ruff-snapshot.json"
      - name: Check Ruff formatting and lint
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/base-ruff-snapshot.json" ]]; then
            export WEB_DECISION_RUFF_BASELINE="$RUNNER_TEMP/base-ruff-snapshot.json"
          fi
          uv run --locked --no-sync --only-group quality python scripts/ci/check_python_quality.py
      - name: Install hash-locked model test dependencies
        run: uv pip install --require-hashes --only-binary=:all: --python .venv/bin/python -r requirements-preview-build.lock
      - name: Test Python quality gates and model scripts
        run: |
          uv run --locked --no-sync --only-group quality pytest -q \
            scripts/ci/test_python_complexity.py \
            scripts/ci/test_python_quality.py \
            scripts/test_safe_output.py \
            scripts/test_specialize_q4_direct_serialization.py \
            scripts/test_tvm_kev_shape_order.py
