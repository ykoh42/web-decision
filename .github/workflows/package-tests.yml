name: Package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript migration gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.13.0, 24.0.0, 26.0.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
          run_install: false
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check TypeScript and JavaScript migration policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          pnpm run check:typescript:complete
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: apache/tvm
          ref: 7b5acb32bd271342a24130f4ef439ff6c2e52c6c
          path: .toolchains/apache-tvm-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emscripten-core/emsdk
          ref: d7b4130688bfa348392b921ab04015aa15c4f154
          path: .toolchains/emsdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
          run_install: false
      - name: Prepare pinned TVM runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1
          git -C .toolchains/apache-tvm-src submodule update --init --recursive 3rdparty/tvm-ffi
          .toolchains/emsdk/emsdk install 4.0.23
          .toolchains/emsdk/emsdk activate 4.0.23 --embedded
          source .toolchains/emsdk/emsdk_env.sh
          make -C .toolchains/apache-tvm-src/web -j4 src/tvmjs_runtime_wasi.js
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting and lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          pnpm check:quality
      - name: Run package tests
        run: pnpm test
      - name: Check released package types
        run: pnpm test:types:0.3.0
      - name: Build and verify the package archive
        run: pnpm verify:package
      - name: Install and build the self-contained example
        working-directory: examples/basic
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Check the example uses the installed package
        run: pnpm test:example
