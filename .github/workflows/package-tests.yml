name: Package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_direct_kev:
        description: Build the pinned direct-TVM Kev candidate on a hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  direct-kev-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.build_direct_kev
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
      - name: Install the pinned libatomic runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1=14.2.0-4ubuntu2~24.04.1
          dpkg-query -W -f='${Version}\n' libatomic1
          free -h
          df -h "$GITHUB_WORKSPACE"
      - name: Build direct TVM Kev candidate from pinned official inputs
        env:
          WEB_DECISION_LIBATOMIC_PATH: /usr/lib/x86_64-linux-gnu/libatomic.so.1
        run: scripts/setup_preview.sh models/web-decision-assets/direct-kev-0.6b-q4f16
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: direct-kev-build-report-${{ github.run_id }}
          path: models/web-decision-assets/direct-kev-0.6b-q4f16/direct-tvm-report.json
          if-no-files-found: warn
          retention-days: 7

  typescript:
    if: github.event_name != 'workflow_dispatch' || inputs.build_direct_kev != true
    name: TypeScript migration gate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.13.0, 24.0.0, 26.0.0, 26.13.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
          run_install: false
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check TypeScript and JavaScript migration policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          pnpm run test:quality:complexity
          pnpm run check:typescript:complete
  package-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.build_direct_kev != true
    name: Package test suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.13.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: apache/tvm
          ref: 7b5acb32bd271342a24130f4ef439ff6c2e52c6c
          path: .toolchains/apache-tvm-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emscripten-core/emsdk
          ref: d7b4130688bfa348392b921ab04015aa15c4f154
          path: .toolchains/emsdk
          persist-credentials: false
      - name: Install Node runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
          run_install: false
      - name: Prepare pinned TVM runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C .toolchains/apache-tvm-src submodule update --init --recursive 3rdparty/tvm-ffi
          .toolchains/emsdk/emsdk install 4.0.23
          .toolchains/emsdk/emsdk activate 4.0.23 --embedded
          source .toolchains/emsdk/emsdk_env.sh
          make -C .toolchains/apache-tvm-src/web -f Makefile \
            -f "$GITHUB_WORKSPACE/scripts/tvm-browser-runtime.mk" \
            -j4 src/tvmjs_runtime_wasi.js
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the complete package test suite
        run: pnpm test
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.build_direct_kev != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: apache/tvm
          ref: 7b5acb32bd271342a24130f4ef439ff6c2e52c6c
          path: .toolchains/apache-tvm-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emscripten-core/emsdk
          ref: d7b4130688bfa348392b921ab04015aa15c4f154
          path: .toolchains/emsdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
          run_install: false
      - name: Prepare pinned TVM runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1
          git -C .toolchains/apache-tvm-src submodule update --init --recursive 3rdparty/tvm-ffi
          .toolchains/emsdk/emsdk install 4.0.23
          .toolchains/emsdk/emsdk activate 4.0.23 --embedded
          source .toolchains/emsdk/emsdk_env.sh
          make -C .toolchains/apache-tvm-src/web -f Makefile \
            -f "$GITHUB_WORKSPACE/scripts/tvm-browser-runtime.mk" \
            -j4 src/tvmjs_runtime_wasi.js
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting and lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          pnpm check:quality
      - name: Prepare pinned Kanana tokenizer test assets
        run: node --import tsx scripts/kanana/prepare-tokenizer-test-assets.mts
      - name: Run package tests
        run: pnpm test
      - name: Check package coverage
        run: pnpm test:coverage
      - name: Check released package types
        run: pnpm test:types:0.4.0
      - name: Build and verify the package archive
        run: pnpm verify:package
      - name: Verify upstream provider in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:browser:kev-upstream-provider
      - name: Install and build the self-contained example
        working-directory: examples/basic
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Check the example uses the installed package
        run: pnpm test:example
      - name: Enforce cognitive complexity completion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            export BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          fi
          pnpm run check:complexity:complete
      - name: Verify committed model provenance records; pending models cannot be released
        run: pnpm run check:model-provenance:main
