name: Release checks

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to verify when running this workflow from its matching release tag
        required: true
        type: choice
        options: ['0.1.0', '0.2.0', '0.3.0']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.13.0, 24.0.0, 26.0.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          version: 12.16.1
          require-lockfile: true
          install: false
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97b # v7.0.0
        if: matrix.node == '24.0.0'
        with:
          python-version: '3.12'
      - name: Select release version
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v${REQUESTED_RELEASE_VERSION}" ]]; then
              echo "workflow_dispatch must run from the matching refs/tags/v${REQUESTED_RELEASE_VERSION} tag (checked out: ${GITHUB_REF})" >&2
              exit 1
            fi
            version="$REQUESTED_RELEASE_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "Release checks require a v* tag push or a workflow_dispatch on the matching release tag; checked out: ${GITHUB_REF}" >&2
            exit 1
          fi
          case "$version" in
            0.1.0|0.2.0|0.3.0) ;;
            *) echo "Unsupported release version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting and lint
        if: matrix.node == '24.0.0'
        run: pnpm run check:quality
      - name: Type-check the stable package consumer
        if: matrix.node == '24.0.0'
        run: pnpm run test:types:0.3.0
      - name: Test release package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" == "0.1.0" ]]; then
            script="test:release"
          else
            script="test:release:$RELEASE_VERSION"
          fi
          pnpm run "$script"
      - name: Verify release build requirements
        if: matrix.node == '24.0.0' && steps.release.outputs.version == '0.1.0'
        run: python scripts/verify_preview_build_requirements.py
      - name: Build release package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" == "0.1.0" ]]; then
            script="build:release"
          else
            script="build:release:$RELEASE_VERSION"
          fi
          pnpm run "$script"
      - name: Pack release archive
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" == "0.1.0" ]]; then
            script="pack:release"
          else
            script="pack:release:$RELEASE_VERSION"
          fi
          pnpm run "$script"
      - name: Audit the packed runtime dependency
        if: matrix.node == '24.0.0'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          consumer="$RUNNER_TEMP/web-decision-consumer"
          mkdir -p "$consumer"
          (
            cd "$consumer"
            npm init -y
            npm install "$GITHUB_WORKSPACE/releases/web-decision-$RELEASE_VERSION/build/release/web-decision-$RELEASE_VERSION.tgz" --ignore-scripts
            npm audit --omit=dev
          )
