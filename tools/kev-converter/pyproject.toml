[project]
name = "web-decision-kev-converter"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "apache-tvm==0.27.0.post1",
  "apache-tvm-ffi==0.1.15.post1",
  "huggingface-hub==0.36.2",
  "numpy==2.5.4",
  "peft==0.21.0",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "transformers==4.57.6",
  "torch==2.8.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
