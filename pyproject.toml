[project]
name = "web-decision-dev-tools"
version = "0.0.0"
requires-python = ">=3.12,<3.16"

[dependency-groups]
quality = [
  "complexipy==8.3.0",
  "pyyaml==6.0.3",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.complexipy]
max-complexity-allowed = 15
check-script = true
