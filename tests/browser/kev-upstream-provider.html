<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Experimental Kev provider invariants</title></head>
  <body>
    <pre id="result">running</pre>
    <script type="module">
      import {createKevReconstructedSource, EXPERIMENTAL_KEV_MODEL} from '../../packages/web-decision/src/kev06/upstream-source.mjs';
      import {createModelAssetReader} from '../../packages/web-decision/src/model-assets.js';
      import {readVerifiedAsset, sha256} from '../../packages/web-decision/src/assets.js';
      import {loadDecisionModel} from 'web-decision';

      const label = (value) => document.querySelector('#result').textContent = JSON.stringify(value, null, 2);
      const bytes = new Uint8Array([3, 1, 4, 1, 5, 9, 2, 6]);
      const shardPath = 'weights/params_shard_0.bin';
      const sourceUrl = 'https://hf-test.invalid/pinned/data.bin';
      const base = new URL('https://cache-test.invalid/experimental-kev/');

      function memoryCache({failPut = false} = {}) {
        const entries = new Map();
        return {
          entries,
          async match(key) { return entries.get(String(key))?.clone(); },
          async put(key, response) {
            if (failPut) throw new DOMException('quota exceeded', 'QuotaExceededError');
            entries.set(String(key), response.clone());
          }
        };
      }

      async function fixture({sourceBytes = bytes, sourceResponse, responseHeaders = {}, expectedSource = bytes, sourceUrl: overrideUrl = sourceUrl} = {}) {
        const sourceSha = await sha256(expectedSource);
        const shardSha = await sha256(expectedSource);
        const manifest = {
          files: {[shardPath]: {bytes: expectedSource.byteLength, sha256: shardSha}}
        };
        const map = {
          schemaVersion: 1,
          source: {
            repository: 'test/model', revision: 'deadbeef', path: 'onnx/data.bin',
            bytes: expectedSource.byteLength, sha256: sourceSha, parameterRegionStart: 0
          },
          target: {shards: [{path: shardPath, bytes: expectedSource.byteLength, sha256: shardSha}]},
          records: [
            {sourceOffset: 0, targetOffset: 0, bytes: 4, shardIndex: 0},
            {sourceOffset: 4, targetOffset: 4, bytes: 4, shardIndex: 0}
          ]
        };
        const mapText = JSON.stringify(map);
        const mapSha = await sha256(new TextEncoder().encode(mapText));
        const headers = new Headers(responseHeaders);
        let fetchCount = 0;
        let sourceSignal;
        let resolveSource;
        let rejectSource;
        let sourcePromise;
        const profile = {
          manifest,
          sourceShardMapText: mapText,
          sourceUrl: overrideUrl,
          sourceBytes: expectedSource.byteLength,
          sourceSha256: sourceSha,
          mapSha256: mapSha,
          repository: 'test/model',
          revision: 'deadbeef',
          sourcePath: 'onnx/data.bin',
          parameterRegionStart: 0,
          tensorCount: 2,
          progressChunkBytes: 2,
          bundledUrls: {},
          cacheBase: base,
          preflight: async () => {},
          openCache: async () => null,
          fetchSource: (url, init) => {
            fetchCount++;
            sourceSignal = init.signal;
            if (!sourcePromise) sourcePromise = new Promise((resolve, reject) => { resolveSource = resolve; rejectSource = reject; });
            if (init.signal) init.signal.addEventListener('abort', () => rejectSource?.(init.signal.reason), {once: true});
            if (sourceResponse) queueMicrotask(() => resolveSource?.(sourceResponse));
            else if (sourceBytes) queueMicrotask(() => resolveSource?.(new Response(sourceBytes, {headers})));
            return sourcePromise;
          }
        };
        const createProvider = () => createKevReconstructedSource(profile);
        return {manifest, profile, createProvider, fetchCount: () => fetchCount, sourceSignal: () => sourceSignal,
          resolve: (response) => resolveSource?.(response), reject: (cause) => rejectSource?.(cause), mapText, mapSha};
      }

      async function cacheShard(provider, manifest, cache, signal) {
        const prepared = await provider.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true, signal});
        return readVerifiedAsset(prepared.base, manifest, shardPath, {
          cache, signal, fetchImpl: provider.fetch, onCacheStatus: (cached) => { window.lastCachedStatus = cached; }
        });
      }

      async function waitFor(predicate, message) {
        for (let i = 0; i < 100; i++) {
          if (predicate()) return;
          await new Promise((resolve) => setTimeout(resolve, 5));
        }
        throw new Error(message);
      }

      async function run() {
        const success = await fixture({responseHeaders: {}});

        async function expectUnsupportedWebGpu(navigatorValue, label) {
          const original = Object.getOwnPropertyDescriptor(globalThis, 'navigator');
          if (original && !original.configurable) throw new Error('The browser cannot replace navigator for this test.');
          const originalFetch = globalThis.fetch;
          let fetchCalls = 0;
          globalThis.fetch = (...args) => { fetchCalls++; return originalFetch(...args); };
          let result;
          try {
            Object.defineProperty(globalThis, 'navigator', {configurable: true, value: navigatorValue});
            try {
              await loadDecisionModel({modelId: 'kev-0.6b-q4f16', cache: true});
              throw new Error(`${label}: prepare unexpectedly succeeded.`);
            } catch (cause) {
              result = cause;
            }
            if (result?.code !== 'UNSUPPORTED_ENVIRONMENT')
              throw new Error(`${label}: expected UNSUPPORTED_ENVIRONMENT, received ${result?.code ?? result}.`);
            if (fetchCalls !== 0) throw new Error(`${label}: fetch began before environment rejection.`);
          } finally {
            globalThis.fetch = originalFetch;
            if (original) Object.defineProperty(globalThis, 'navigator', original);
            else delete globalThis.navigator;
          }
        }

        await expectUnsupportedWebGpu(undefined, 'Missing navigator');
        await expectUnsupportedWebGpu({}, 'Missing navigator.gpu');

        const successProvider = success.createProvider();
        const successCache = memoryCache();
        const successProgress = [];
        successProvider.setProgress((event) => successProgress.push(event));
        const successBytes = await cacheShard(successProvider, success.manifest, successCache);
        if (await sha256(successBytes) !== await sha256(bytes)) throw new Error('No-Content-Length exact-size verification failed.');
        if (success.fetchCount() !== 1 || successCache.entries.size !== 1) throw new Error('Verified shard was not cached exactly once.');
        if (!successProgress.some((event) => event.phase === 'upstream-source' && event.loadedBytes === bytes.byteLength))
          throw new Error('Coarse upstream-source progress was not reported.');
        await successProvider.dispose();

        const bundledJson = new TextEncoder().encode('{"source":"bundled"}');
        const bundledManifest = {
          files: {
            ...success.manifest.files,
            'model_config.json': {bytes: bundledJson.byteLength, sha256: await sha256(bundledJson)}
          }
        };
        const bundledDataUrl = `data:application/json;base64,${btoa(String.fromCharCode(...bundledJson))}`;
        const bundledProvider = createKevReconstructedSource({
          ...success.profile,
          manifest: bundledManifest,
          bundledUrls: {'model_config.json': bundledDataUrl}
        });
        const bundledPrepared = await bundledProvider.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true});
        const bundledCache = memoryCache();
        const bundledBytes = await readVerifiedAsset(bundledPrepared.base, bundledManifest, 'model_config.json', {
          cache: bundledCache, fetchImpl: bundledProvider.fetch
        });
        if (new TextDecoder().decode(bundledBytes) !== '{"source":"bundled"}' || bundledCache.entries.size !== 1)
          throw new Error('Bundled data URL was not decoded and SHA-verified without fetch().');
        await bundledProvider.dispose();

        const tooLarge = await fixture({sourceBytes: new Uint8Array([...bytes, 0]), responseHeaders: {}});
        const tooLargeProvider = tooLarge.createProvider();
        const tooLargeCache = memoryCache();
        let tooLargeRejected = false;
        try { await cacheShard(tooLargeProvider, tooLarge.manifest, tooLargeCache); } catch { tooLargeRejected = true; }
        if (!tooLargeRejected || tooLargeCache.entries.size !== 0) throw new Error('Oversized source was accepted or cached.');
        await tooLargeProvider.dispose();

        const wrongHash = await fixture({sourceBytes: new Uint8Array([9, 9, 9, 9, 5, 9, 2, 6]), responseHeaders: {}});
        const wrongHashProvider = wrongHash.createProvider();
        const wrongHashCache = memoryCache();
        let wrongHashRejected = false;
        try { await cacheShard(wrongHashProvider, wrongHash.manifest, wrongHashCache); } catch { wrongHashRejected = true; }
        if (!wrongHashRejected || wrongHashCache.entries.size !== 0) throw new Error('Bad source SHA was accepted or cached.');
        await wrongHashProvider.dispose();

        const badHeader = await fixture({responseHeaders: {'content-length': '7'}});
        const badHeaderProvider = badHeader.createProvider();
        const badHeaderCache = memoryCache();
        let badHeaderRejected = false;
        try { await cacheShard(badHeaderProvider, badHeader.manifest, badHeaderCache); } catch { badHeaderRejected = true; }
        if (!badHeaderRejected || badHeaderCache.entries.size !== 0) throw new Error('Wrong declared source length was accepted or cached.');
        await badHeaderProvider.dispose();

        const quota = await fixture({responseHeaders: {}});
        const quotaProvider = quota.createProvider();
        const quotaCache = memoryCache({failPut: true});
        const quotaProgress = [];
        const quotaPrepared = await quotaProvider.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true});
        const quotaReader = createModelAssetReader({base: quotaPrepared.base, manifest: quota.manifest, cache: quotaCache,
          signal: undefined, options: {offline: false, onProgress: (event) => quotaProgress.push(event)},
          fetchImpl: quotaProvider.fetch, progressPhase: 'asset-verification'});
        await quotaReader.read(shardPath);
        if (quotaReader.isCacheComplete()) throw new Error('Cache quota failure was treated as a complete verified pack.');
        if (!quotaProgress.some((event) => event.phase === 'asset-verification'))
          throw new Error('Asset-verification progress phase was not reported.');
        await quotaProvider.dispose();

        const phaseFixture = await fixture({responseHeaders: {}});
        const packagedConfig = new TextEncoder().encode('{}');
        const phaseManifest = {
          files: {
            ...phaseFixture.manifest.files,
            'model_config.json': {bytes: packagedConfig.byteLength, sha256: await sha256(packagedConfig)}
          }
        };
        const packagedConfigUrl = `data:application/json;base64,${btoa(String.fromCharCode(...packagedConfig))}`;
        const phaseProvider = createKevReconstructedSource({
          ...phaseFixture.profile,
          manifest: phaseManifest,
          bundledUrls: {'model_config.json': packagedConfigUrl}
        });
        const phasePrepared = await phaseProvider.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true});
        const phaseEvents = [];
        phaseProvider.setProgress((event) => phaseEvents.push(event));
        const phaseCache = memoryCache({failPut: true});
        const phaseReader = createModelAssetReader({
          base: phasePrepared.base,
          manifest: phaseManifest,
          cache: phaseCache,
          signal: undefined,
          options: {offline: false, onProgress: (event) => phaseEvents.push(event)},
          fetchImpl: phaseProvider.fetch,
          progressPhase: 'bundled-assets'
        });
        await phaseReader.read('model_config.json');
        phaseReader.setProgressPhase('asset-verification');
        await phaseReader.read(shardPath);
        const firstAssetVerification = phaseEvents.findIndex((event) => event.phase === 'asset-verification');
        if (firstAssetVerification < 0) throw new Error('Phase test did not reach shard verification.');
        await phaseReader.read(shardPath);
        const phases = phaseEvents.map((event) => event.phase).filter(Boolean)
          .filter((phase, index, sequence) => index === 0 || phase !== sequence[index - 1]);
        if (JSON.stringify(phases) !== JSON.stringify(['bundled-assets', 'upstream-source', 'asset-verification']))
          throw new Error(`Progress phases did not advance monotonically: ${JSON.stringify(phases)}`);
        if (phaseEvents.slice(firstAssetVerification + 1).some((event) => event.phase === 'upstream-source'))
          throw new Error('Source completion was replayed after shard verification began.');
        await phaseProvider.dispose();

        let cancelStarted = false;
        const neverSettlingBody = new ReadableStream({
          pull() {},
          cancel() { cancelStarted = true; return new Promise(() => {}); }
        });
        const cancellation = await fixture({sourceBytes: null, sourceResponse: new Response(neverSettlingBody)});
        const cancellationProvider = cancellation.createProvider();
        const cancellationController = new AbortController();
        const cancellationPrepared = await cancellationProvider.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true,
          signal: cancellationController.signal});
        const cancellationRead = readVerifiedAsset(cancellationPrepared.base, cancellation.manifest, shardPath, {
          cache: memoryCache(), signal: cancellationController.signal, fetchImpl: cancellationProvider.fetch
        });
        await waitFor(() => cancellation.fetchCount() === 1, 'Cancellation test did not start source GET.');
        cancellationController.abort(new DOMException('stop source read', 'AbortError'));
        const cancellationOutcome = await Promise.race([
          cancellationRead.then(() => 'unexpected-success', () => 'aborted'),
          new Promise((resolve) => setTimeout(() => resolve('timed-out'), 1000))
        ]);
        await cancellationProvider.dispose();
        if (cancellationOutcome !== 'aborted' || !cancelStarted)
          throw new Error('Abort waited for a non-settling body cancel operation.');

        const concurrent = await fixture({sourceBytes: null, responseHeaders: {}});
        const providerA = concurrent.createProvider();
        const providerB = concurrent.createProvider();
        const controllerA = new AbortController();
        const cacheA = memoryCache();
        const cacheB = memoryCache();
        const preparedA = await providerA.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true, signal: controllerA.signal});
        const preparedB = await providerB.prepare({model: EXPERIMENTAL_KEV_MODEL, cache: true});
        let providerACalls = 0;
        let providerBCalls = 0;
        const fetchA = providerA.fetch;
        const fetchB = providerB.fetch;
        providerA.fetch = (...args) => { providerACalls++; return fetchA(...args); };
        providerB.fetch = (...args) => { providerBCalls++; return fetchB(...args); };
        const loadA = readVerifiedAsset(preparedA.base, concurrent.manifest, shardPath, {
          cache: cacheA, signal: controllerA.signal, fetchImpl: providerA.fetch
        });
        const loadB = readVerifiedAsset(preparedB.base, concurrent.manifest, shardPath, {
          cache: cacheB, fetchImpl: providerB.fetch
        });
        await waitFor(() => providerACalls === 1 && providerBCalls === 1 && concurrent.fetchCount() === 1,
          'Concurrent providers did not share one source GET.');
        controllerA.abort(new DOMException('cancel only first load', 'AbortError'));
        let firstAborted = false;
        try { await loadA; } catch { firstAborted = true; }
        await providerA.dispose();
        if (!firstAborted || concurrent.sourceSignal().aborted) throw new Error('Aborting one subscriber canceled the shared source read.');
        concurrent.resolve(new Response(bytes, {headers: {'content-length': String(bytes.byteLength)}}));
        const survivingBytes = await loadB;
        if (await sha256(survivingBytes) !== await sha256(bytes)) throw new Error('Second concurrent provider did not finish after first abort.');
        await providerB.dispose();

        label({ok: true, checks: {
          missingContentLengthAcceptedWithExactBound: true,
          bundledDataUrlDecodedWithoutConnectFetch: true,
          missingNavigatorAndNavigatorGpuReturnUnsupportedEnvironment: true,
          oversizedSourceRejectedWithoutCacheWrite: true,
          sourceHashMismatchRejectedWithoutCacheWrite: true,
          wrongContentLengthRejectedWithoutCacheWrite: true,
          cacheQuotaLeavesReaderIncomplete: true,
          progressPhasesAdvanceOnceAcrossBundledSourceAndShards: true,
          nonSettlingBodyCancelDoesNotBlockAbort: true,
          coarseProgressHasDistinctPhases: true,
          concurrentLoadsSharedOneSourceGet: concurrent.fetchCount() === 1,
          firstAbortLeftSecondSourceReadAlive: !concurrent.sourceSignal().aborted,
          secondConcurrentLoadCompleted: true
        }});
      }

      run().catch((error) => label({ok: false, error: String(error), stack: error.stack}));
    </script>
  </body>
</html>
